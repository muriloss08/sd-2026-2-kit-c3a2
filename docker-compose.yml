
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  inferencia:
    build: ./inferencia
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  worker:
    build: ./worker
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      - URL_INFERENCIA=http://inferencia:8001
      - JWT_SEGREDO=${JWT_SEGREDO:-troque-este-segredo}
      - LOGIN_USUARIO=${LOGIN_USUARIO:-admin}
      - LOGIN_SENHA=${LOGIN_SENHA:-admin123}
    depends_on:
      - inferencia
    restart: unless-stopped

volumes:
  qdrant_storage:
